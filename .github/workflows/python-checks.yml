name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
            venv_python: ./.venv/bin/python
          - os: windows-latest
            python: '3.13'
            venv_python: ./.venv/Scripts/python.exe
          - os: ubuntu-latest
            python: '3.11'
            venv_python: ./.venv/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the setup installer
        run: python setup_umabot.py --install-only
      - name: Install development tools
        run: ${{ matrix.venv_python }} -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: ${{ matrix.venv_python }} -m pip check
      - name: Lint Python sources
        run: ${{ matrix.venv_python }} -m ruff check .
      - name: Compile Python sources
        run: ${{ matrix.venv_python }} -m compileall -q uma_bot.py umabot
      - name: Import bot entry point
        run: ${{ matrix.venv_python }} -c "from umabot.bot import main"
      - name: Run regression tests
        run: ${{ matrix.venv_python }} -m unittest discover -s tests
